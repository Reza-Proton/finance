<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e52">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>مدیریت مالی</title>
<style>
:root{--bg:#f2f4f1;--ink:#17211c;--mut:#5d6b64;--line:#d5dbd6;--card:#fff;--acc:#0f5e52;--onacc:#fff;--bad:#b3341f;--warn:#8f5f00;--ok:#2f6f3e}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--ink:#e8eeea;--mut:#9aa8a0;--line:#2b3631;--card:#1b2420;--acc:#4fb8a4;--onacc:#0b1411;--bad:#ff8a73;--warn:#e2b04a;--ok:#7fcf90}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Samsung Sans",Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto}
h1{margin:0;font-size:24px}
#summary{margin:4px 0 0;color:var(--mut);font-size:15px}
main{padding:8px 16px;display:grid;gap:12px;max-width:640px;margin:0 auto}
h3.sep{margin:12px 0 0;font-size:15px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-right:6px solid var(--line);border-radius:10px;padding:12px 14px}
.card.bad{border-right-color:var(--bad)}.card.warn{border-right-color:var(--warn)}.card.ok{border-right-color:var(--ok)}.card.acc{border-right-color:var(--acc)}
.card.arch{opacity:.65}
.card h2{margin:0;font-size:17px}
.status{font-size:20px;font-weight:700;margin:2px 0}
.bad .status{color:var(--bad)}.warn .status{color:var(--warn)}.ok .status{color:var(--ok)}
.meta{color:var(--mut);font-size:14px}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;min-height:44px}
button.main{background:var(--acc);color:var(--onacc);border-color:var(--acc);flex:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#add{position:fixed;inset-inline:16px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:608px;margin:auto;background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:56px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.empty{color:var(--mut);text-align:center;padding:40px 0}
dialog{width:min(92vw,420px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px;font-size:18px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.dates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.err{color:var(--bad);min-height:1.5em;font-size:14px}
[hidden]{display:none!important}
</style>
<script>
addEventListener('error', function (e) {
  var t = e.target, msg = (t && t.src) ? 'Failed to load: ' + t.src.split('/').pop() : 'Error: ' + e.message + ' (line ' + e.lineno + ')';
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;background:#b3341f;color:#fff;padding:8px;font:13px monospace;direction:ltr';
  d.textContent = msg; document.documentElement.appendChild(d);
}, true);
</script>
</head>
<body>
<header><h1 id="title"></h1><p id="summary"></p></header>
<main id="list"></main>
<button id="add"></button>
<nav id="nav"><button data-v="accounts">حساب‌ها</button><button data-v="tx">تراکنش‌ها</button><button data-v="loans">سررسیدها</button></nav>

<dialog id="dlgAcc">
<form id="formAcc">
  <h3 id="accTitle"></h3>
  <label>نام حساب<input name="name" required maxlength="40"></label>
  <label>نوع حساب
    <select name="type"><option value="cash">نقد</option><option value="bank">بانکی</option></select>
  </label>
  <label>موجودی اولیه (ریال)<input name="opening" inputmode="numeric" required value="0" class="ltr money"></label>
  <div id="bankFields">
    <label>شماره حساب (اختیاری)<input name="number" inputmode="text" maxlength="40" class="ltr"></label>
    <label>شماره شبا (اختیاری)<input name="iban" inputmode="text" maxlength="30" placeholder="IR..." class="ltr"></label>
  </div>
  <p class="err" role="alert" id="errAcc"></p>
  <div class="row"><button class="main" type="submit">ذخیره حساب</button><button type="button" id="cancelAcc">انصراف</button></div>
</form>
</dialog>

<dialog id="dlgLoan">
<form id="formLoan">
  <h3 id="loanTitle"></h3>
  <label>عنوان وام<input name="title" required maxlength="60"></label>
  <label>مبلغ کل وام (ریال، اختیاری)<input name="principal" inputmode="numeric" class="ltr money"></label>
  <label>مبلغ هر قسط (ریال)<input name="amount" inputmode="numeric" required class="ltr money"></label>
  <label>تعداد کل اقساط<input name="total" inputmode="numeric" required class="ltr"></label>
  <label>تعداد اقساط پرداخت‌شده<input name="paid" inputmode="numeric" value="0" required class="ltr"></label>
  <label>تاریخ سررسید قسط بعدی (سال / ماه / روز)</label>
  <div class="dates">
    <input name="y" inputmode="numeric" aria-label="سال" required class="ltr">
    <input name="m" inputmode="numeric" aria-label="ماه" required class="ltr">
    <input name="d" inputmode="numeric" aria-label="روز" required class="ltr">
  </div>
  <p class="err" role="alert" id="errLoan"></p>
  <div class="row"><button class="main" type="submit">ذخیره وام</button><button type="button" id="cancelLoan">انصراف</button></div>
</form>
</dialog>

<dialog id="dlgTx">
<form id="formTx">
  <h3 id="txTitle"></h3>
  <label>نوع تراکنش
    <select name="type"><option value="expense">هزینه</option><option value="income">درآمد</option><option value="transfer">انتقال بین حساب‌ها</option></select>
  </label>
  <label><span id="lblAcc">از حساب</span><select name="accountId"></select></label>
  <label id="lblTo" hidden>به حساب<select name="toId"></select></label>
  <label>مبلغ (ریال)<input name="amount" inputmode="numeric" required class="ltr money"></label>
  <label id="lblFee">کارمزد (ریال، اختیاری)<input name="fee" inputmode="numeric" value="0" class="ltr money"></label>
  <div id="catFields">
    <label>دسته‌بندی<select name="category"></select></label>
    <label id="lblSub">زیردسته<select name="sub"></select></label>
  </div>
  <label>تاریخ (سال / ماه / روز)</label>
  <div class="dates">
    <input name="y" inputmode="numeric" aria-label="سال" required class="ltr">
    <input name="m" inputmode="numeric" aria-label="ماه" required class="ltr">
    <input name="d" inputmode="numeric" aria-label="روز" required class="ltr">
  </div>
  <label>توضیح (اختیاری)<input name="note" maxlength="100"></label>
  <p class="err" role="alert" id="errTx"></p>
  <div class="row"><button class="main" type="submit">ذخیره تراکنش</button><button type="button" id="cancelTx">انصراف</button></div>
</form>
</dialog>

<dialog id="dlgPay">
<form id="formPay">
  <h3 id="payTitle"></h3>
  <label>از حساب<select name="account"></select></label>
  <label>مبلغ (ریال)<input name="amount" inputmode="numeric" required class="ltr money"></label>
  <label>کارمزد (ریال، اختیاری)<input name="fee" inputmode="numeric" value="0" class="ltr money"></label>
  <label>تاریخ پرداخت (سال / ماه / روز)</label>
  <div class="dates">
    <input name="y" inputmode="numeric" aria-label="سال" required class="ltr">
    <input name="m" inputmode="numeric" aria-label="ماه" required class="ltr">
    <input name="d" inputmode="numeric" aria-label="روز" required class="ltr">
  </div>
  <p class="err" role="alert" id="errPay"></p>
  <div class="row"><button class="main" type="submit">ثبت پرداخت</button><button type="button" id="cancelPay">انصراف</button></div>
</form>
</dialog>

<script src="jalali.js"></script>
<script src="util.js"></script>
<script src="categories.js"></script>
<script>
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const { toInt, validIban } = Util;
let db, view = 'accounts';

// ---- storage (IndexedDB) ----
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('finance', 3);
    r.onupgradeneeded = () => {
      for (const n of ['loans', 'accounts', 'transactions'])
        if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = s => tx(s, 'readonly', o => o.getAll());
const put = (s, v) => tx(s, 'readwrite', o => o.put(v));
const del = (s, id) => tx(s, 'readwrite', o => o.delete(id));

// ---- navigation ----
async function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const V = { accounts: ['حساب‌ها', 'حساب جدید', renderAccounts], tx: ['تراکنش‌ها', 'تراکنش جدید', renderTx], loans: ['سررسیدها', 'وام جدید', renderLoans] }[view];
  $('#title').textContent = V[0];
  $('#add').textContent = V[1];
  await V[2]();
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (b) { view = b.dataset.v; render(); }
});
$('#add').onclick = () => ({ accounts: openAccount, tx: openTx, loans: openLoan }[view])();

// ================= ACCOUNTS =================
// Balance is always computed. Transactions will be added here later.
let BAL = new Map();
const balance = a => (BAL.has(a.id) ? BAL.get(a.id) : a.opening);
const fmtIban = s => s.replace(/(.{4})/g, '$1 ').trim();

async function renderAccounts() {
  const all = await getAll('accounts');
  BAL = computeBalances(all, await getAll('transactions'));
  const active = all.filter(a => !a.archived), archived = all.filter(a => a.archived);
  $('#summary').textContent = active.length ? `جمع مانده‌ها: ${fa(active.reduce((s, a) => s + balance(a), 0))} ریال` : '';
  const card = a => `
    <article class="card acc ${a.archived ? 'arch' : ''}">
      <h2>${esc(a.name)} <span class="meta">· ${a.type === 'cash' ? 'نقد' : 'بانکی'}</span></h2>
      <div class="status">${fa(balance(a))} ریال</div>
      ${a.number ? `<div class="meta">شماره حساب: <span class="ltr">${esc(a.number)}</span></div>` : ''}
      ${a.iban ? `<div class="meta">شبا: <span class="ltr">${fmtIban(a.iban)}</span></div>` : ''}
      <div class="row">
        <button data-act="edit" data-id="${a.id}">ویرایش</button>
        <button data-act="arch" data-id="${a.id}">${a.archived ? 'بازگردانی' : 'بایگانی'}</button>
      </div>
    </article>`;
  $('#list').innerHTML = all.length
    ? active.map(card).join('') + (archived.length ? '<h3 class="sep">بایگانی</h3>' + archived.map(card).join('') : '')
    : '<p class="empty">هنوز حسابی ثبت نکردی.<br>با دکمه «حساب جدید» شروع کن.</p>';
}

const dlgAcc = $('#dlgAcc'), formAcc = $('#formAcc');
let editingId = null;
function toggleBankFields() { $('#bankFields').hidden = formAcc.type.value !== 'bank'; }
formAcc.type.addEventListener('change', toggleBankFields);
function openAccount(a) {
  formAcc.reset();
  editingId = a ? a.id : null;
  $('#accTitle').textContent = a ? 'ویرایش حساب' : 'حساب جدید';
  if (a) {
    formAcc.name.value = a.name; formAcc.type.value = a.type; formAcc.opening.value = a.opening.toLocaleString('en-US');
    formAcc.number.value = a.number || ''; formAcc.iban.value = a.iban || '';
  }
  toggleBankFields();
  $('#errAcc').textContent = '';
  dlgAcc.showModal();
}
$('#cancelAcc').onclick = () => dlgAcc.close();
formAcc.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formAcc));
  const name = v.name.trim(), opening = toInt(v.opening);
  const all = await getAll('accounts');
  let err = '', iban = '';
  if (!name) err = 'نام حساب رو وارد کن.';
  else if (all.some(a => a.id !== editingId && a.name.trim().toLowerCase() === name.toLowerCase())) err = 'حسابی با این نام وجود داره.';
  else if (Number.isNaN(opening)) err = 'موجودی اولیه باید عدد صحیح و صفر یا بیشتر باشه.';
  if (!err && v.type === 'bank' && v.iban.trim()) {
    iban = validIban(v.iban);
    if (!iban) err = 'شماره شبا معتبر نیست. (IR و ۲۴ رقم)';
  }
  if (err) { $('#errAcc').textContent = err; return; }
  const old = editingId ? all.find(a => a.id === editingId) : null;
  const rec = { ...(old || {}), name, type: v.type, opening, archived: old ? old.archived : false,
    number: v.type === 'bank' ? Util.norm(v.number).trim() : '', iban: v.type === 'bank' ? iban : '' };
  if (old) {
    const neg = firstNegative(all.map(a => (a.id === rec.id ? rec : a)), await getAll('transactions'));
    if (neg) { $('#errAcc').textContent = `با این موجودی اولیه، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  }
  await put('accounts', rec);
  dlgAcc.close();
  render();
});
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.act;
  if (act.startsWith('tx')) { await txAction(act, id); render(); return; }
  if (act === 'edit' || act === 'arch') {
    const a = (await getAll('accounts')).find(x => x.id === id);
    if (!a) return;
    if (act === 'edit') return openAccount(a);
    if (!a.archived && balance(a) !== 0) { alert('برای بایگانی، مانده حساب باید صفر باشه. اول پول رو به حساب دیگه منتقل کن.'); return; }
    a.archived = !a.archived;
    await put('accounts', a);
  } else {
    await loanAction(act, id);
  }
  render();
});

// ================= LOANS =================
// A loan stores an anchor (paid count + next due month at entry time). Installment payments are
// expense transactions linked with ref = {kind:'loan', id}; paid count and next due are derived from them.
const addMonths = (y, m, k) => { const t = y * 12 + (m - 1) + k; return [Math.floor(t / 12), ((t % 12) + 12) % 12 + 1]; };
const linkedTx = (l, txs) => txs.filter(t => t.ref && t.ref.kind === 'loan' && t.ref.id === l.id);
function loanState(l, txs) {
  const k = linkedTx(l, txs).length;
  const [ay, am] = l.anchorDue || l.due; // l.due / l.paid: format of loans saved by older versions
  const [y, m] = addMonths(ay, am, k);
  return { k, paid: (l.anchorPaid != null ? l.anchorPaid : l.paid) + k, due: [y, m, Math.min(l.dueDay, Jal.monthDays(y, m))] };
}
const fmtDate = ([y, m, d]) => `${fa(d)} ${Jal.MONTHS[m - 1]} ${String(fa(y)).replace(/٬/g, '')}`;
function describe(due) {
  const diff = Jal.toDayNum(...due) - Jal.todayNum();
  if (diff < 0) return { diff, cls: 'bad', text: `${fa(-diff)} روز عقب‌افتاده` };
  if (diff === 0) return { diff, cls: 'bad', text: 'سررسید امروز' };
  if (diff <= 7) return { diff, cls: 'warn', text: `${fa(diff)} روز دیگه` };
  return { diff, cls: 'ok', text: `${fa(diff)} روز دیگه` };
}
async function renderLoans() {
  const [loans, txs] = await Promise.all([getAll('loans'), getAll('transactions')]);
  const items = loans.map(l => { const st = loanState(l, txs); return { l, st, s: st.paid < l.total ? describe(st.due) : null }; });
  const active = items.filter(x => x.s).sort((a, b) => a.s.diff - b.s.diff);
  const done = items.filter(x => !x.s);
  const urgent = active.filter(x => x.s.diff <= 7).length;
  $('#summary').textContent = !loans.length ? '' : urgent ? `${fa(urgent)} قسط تا ۷ روز آینده یا عقب‌افتاده` : 'قسطی تا ۷ روز آینده نداری';
  const card = ({ l, st, s }) => `
    <article class="card ${s ? s.cls : ''}">
      <h2>${esc(l.title)}</h2>
      ${s ? `<div class="status">${s.text}</div><div class="meta">سررسید ${fmtDate(st.due)} · مبلغ ${fa(l.amount)} ریال</div>` : `<div class="status">تسویه شد</div>`}
      <div class="meta">${fa(st.paid)} از ${fa(l.total)} قسط پرداخت شده${s ? ` · مانده ${fa((l.total - st.paid) * l.amount)} ریال` : ''}</div>
      ${l.principal ? `<div class="meta">مبلغ کل وام: ${fa(l.principal)} ریال</div>` : ''}
      <div class="row">
        ${s ? `<button class="main" data-act="pay" data-id="${l.id}">پرداخت قسط</button>` : ''}
        <button data-act="ledit" data-id="${l.id}">ویرایش</button>
        <button data-act="del" data-id="${l.id}">حذف</button>
      </div>
    </article>`;
  $('#list').innerHTML = loans.length
    ? active.map(card).join('') + done.map(card).join('')
    : '<p class="empty">هنوز وامی ثبت نکردی.<br>با دکمه «وام جدید» شروع کن.</p>';
}
async function loanAction(act, id) {
  const [loans, txs] = await Promise.all([getAll('loans'), getAll('transactions')]);
  const l = loans.find(x => x.id === id);
  if (!l) return;
  if (act === 'pay') return openPay(l, loanState(l, txs));
  if (act === 'ledit') return openLoan(l);
  if (act === 'del' && confirm(`وام «${l.title}» حذف بشه؟ تراکنش‌های پرداخت قسط حذف نمی‌شن.`)) {
    for (const t of linkedTx(l, txs)) await put('transactions', { ...t, ref: null });
    await del('loans', id);
  }
}

// ---- add / edit loan ----
const dlgLoan = $('#dlgLoan'), formLoan = $('#formLoan');
let editingLoan = null;
async function openLoan(l) {
  formLoan.reset();
  editingLoan = l ? l.id : null;
  $('#loanTitle').textContent = l ? 'ویرایش وام' : 'وام جدید';
  let date = Jal.fromDayNum(Jal.todayNum());
  if (l) {
    const st = loanState(l, await getAll('transactions'));
    formLoan.title.value = l.title;
    formLoan.principal.value = l.principal ? l.principal.toLocaleString('en-US') : '';
    formLoan.amount.value = l.amount.toLocaleString('en-US');
    formLoan.total.value = l.total; formLoan.paid.value = st.paid;
    date = st.due;
  }
  formLoan.y.value = date[0]; formLoan.m.value = date[1]; formLoan.d.value = date[2];
  $('#errLoan').textContent = '';
  dlgLoan.showModal();
}
$('#cancelLoan').onclick = () => dlgLoan.close();
formLoan.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formLoan));
  const n = Object.fromEntries(['amount', 'total', 'paid', 'y', 'm', 'd'].map(k => [k, toInt(v[k])]));
  const principal = v.principal.trim() ? toInt(v.principal) : 0;
  let err = '';
  if (Object.values(n).some(Number.isNaN) || Number.isNaN(principal)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1 || n.total < 1) err = 'مبلغ قسط و تعداد اقساط باید بیشتر از صفر باشه.';
  else if (n.paid > n.total) err = 'اقساط پرداخت‌شده بیشتر از کل اقساطه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ سررسید معتبر نیست.';
  let k = 0;
  if (!err && editingLoan) {
    const loan = (await getAll('loans')).find(x => x.id === editingLoan);
    k = linkedTx(loan, await getAll('transactions')).length;
    if (n.paid < k) err = `تعداد پرداخت‌شده نمی‌تونه کمتر از ${fa(k)} باشه، چون ${fa(k)} قسط از طریق تراکنش ثبت شده.`;
  }
  if (err) { $('#errLoan').textContent = err; return; }
  const rec = { title: v.title.trim(), principal, amount: n.amount, total: n.total,
    anchorPaid: n.paid - k, anchorDue: addMonths(n.y, n.m, -k), dueDay: n.d };
  if (editingLoan) rec.id = editingLoan;
  await put('loans', rec);
  dlgLoan.close();
  render();
});

// ---- pay an installment (creates a linked expense transaction) ----
const dlgPay = $('#dlgPay'), formPay = $('#formPay');
let payCtx = null;
async function openPay(l, st) {
  const [accounts, txs] = await Promise.all([getAll('accounts'), getAll('transactions')]);
  const bal = computeBalances(accounts, txs);
  const active = accounts.filter(a => !a.archived);
  if (!active.length) { alert('اول توی بخش حساب‌ها یه حساب بساز.'); return; }
  payCtx = { l, st };
  formPay.reset();
  formPay.account.innerHTML = active.map(a => `<option value="${a.id}">${esc(a.name)} (مانده ${fa(bal.get(a.id))})</option>`).join('');
  formPay.amount.value = l.amount.toLocaleString('en-US');
  const [y, m, d] = Jal.fromDayNum(Jal.todayNum());
  formPay.y.value = y; formPay.m.value = m; formPay.d.value = d;
  $('#payTitle').textContent = `قسط ${fa(st.paid + 1)} از ${fa(l.total)} · ${l.title}`;
  $('#errPay').textContent = '';
  dlgPay.showModal();
}
$('#cancelPay').onclick = () => dlgPay.close();
formPay.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formPay));
  const n = Object.fromEntries(['amount', 'fee', 'y', 'm', 'd'].map(k => [k, toInt(v[k] || '0')]));
  let err = '';
  if (Object.values(n).some(Number.isNaN)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1) err = 'مبلغ باید بیشتر از صفر باشه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ معتبر نیست.';
  if (err) { $('#errPay').textContent = err; return; }
  const { l, st } = payCtx;
  const rec = { type: 'expense', accountId: Number(v.account), amount: n.amount, fee: n.fee,
    note: `${l.title} · قسط ${fa(st.paid + 1)} از ${fa(l.total)}`, date: [n.y, n.m, n.d], day: Jal.toDayNum(n.y, n.m, n.d),
    category: 'اقساط و بدهی‌ها', sub: 'قسط', ref: { kind: 'loan', id: l.id } };
  const accounts = await getAll('accounts');
  const neg = firstNegative(accounts, [...(await getAll('transactions')), rec]);
  if (neg) { $('#errPay').textContent = `با این پرداخت، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  await put('transactions', rec);
  dlgPay.close();
  render();
});

// ================= TRANSACTIONS =================
// Balance = opening + income - expense(amount+fee) - transfer out(amount+fee) + transfer in(amount)
function computeBalances(accounts, txs) {
  const m = new Map(accounts.map(a => [a.id, a.opening]));
  const add = (id, v) => m.set(id, (m.get(id) || 0) + v);
  for (const t of txs) {
    if (t.type === 'income') add(t.accountId, t.amount);
    else if (t.type === 'expense') add(t.accountId, -(t.amount + t.fee));
    else { add(t.accountId, -(t.amount + t.fee)); add(t.toAccountId, t.amount); }
  }
  return m;
}
function firstNegative(accounts, txs) {
  const m = computeBalances(accounts, txs);
  return accounts.find(a => m.get(a.id) < 0);
}
const fmtFull = ([y, m, d]) => `${fa(d)} ${Jal.MONTHS[m - 1]} ${String(fa(y)).replace(/٬/g, '')}`;

async function renderTx() {
  const [txs, accounts] = await Promise.all([getAll('transactions'), getAll('accounts')]);
  const nm = id => (accounts.find(a => a.id === id) || {}).name || '؟';
  txs.sort((a, b) => b.day - a.day || b.id - a.id);
  const [cy, cm] = Jal.fromDayNum(Jal.todayNum());
  let inc = 0, exp = 0;
  for (const t of txs.filter(t => t.date[0] === cy && t.date[1] === cm)) {
    if (t.type === 'income') inc += t.amount;
    else exp += (t.type === 'expense' ? t.amount : 0) + t.fee;
  }
  $('#summary').textContent = txs.length ? `${Jal.MONTHS[cm - 1]}: درآمد ${fa(inc)} · هزینه ${fa(exp)} ریال` : '';
  const card = t => {
    const cls = { income: 'ok', expense: 'bad', transfer: 'acc' }[t.type];
    const sign = { income: '+', expense: '−', transfer: '' }[t.type];
    const title = t.type === 'transfer' ? `از ${esc(nm(t.accountId))} به ${esc(nm(t.toAccountId))}`
      : esc(t.category) + (t.sub ? ' · ' + esc(t.sub) : '');
    return `<article class="card ${cls}">
      <h2>${title}</h2>
      <div class="status">${sign}${fa(t.amount)} ریال</div>
      <div class="meta">${fmtFull(t.date)}${t.type !== 'transfer' ? ' · ' + esc(nm(t.accountId)) : ''}${t.fee ? ` · کارمزد ${fa(t.fee)}` : ''}${t.ref && t.ref.kind === 'loan' ? ' · قسط وام' : ''}</div>
      ${t.note ? `<div class="meta">${esc(t.note)}</div>` : ''}
      <div class="row"><button data-act="txedit" data-id="${t.id}">ویرایش</button><button data-act="txdel" data-id="${t.id}">حذف</button></div>
    </article>`;
  };
  $('#list').innerHTML = txs.length ? txs.map(card).join('') : '<p class="empty">هنوز تراکنشی ثبت نکردی.<br>با دکمه «تراکنش جدید» شروع کن.</p>';
}

const dlgTx = $('#dlgTx'), formTx = $('#formTx');
let editingTx = null, editingTxRef = null, txAccounts = [];
function fillAccountSelects(extraIds) {
  const opts = txAccounts.filter(a => !a.archived || extraIds.includes(a.id)).map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  formTx.accountId.innerHTML = opts; formTx.toId.innerHTML = opts;
}
function fillCategories(keepCat, keepSub) {
  const t = formTx.type.value;
  if (t === 'transfer') return;
  const cats = Object.keys(CATS[t]);
  formTx.category.innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
  if (keepCat && cats.includes(keepCat)) formTx.category.value = keepCat;
  fillSubs(keepSub);
}
function fillSubs(keepSub) {
  const subs = CATS[formTx.type.value][formTx.category.value] || [];
  formTx.sub.innerHTML = subs.map(s => `<option>${esc(s)}</option>`).join('');
  if (keepSub && subs.includes(keepSub)) formTx.sub.value = keepSub;
  $('#lblSub').hidden = !subs.length;
}
function syncTxType() {
  const t = formTx.type.value;
  $('#lblAcc').textContent = t === 'income' ? 'به حساب' : 'از حساب';
  $('#lblTo').hidden = t !== 'transfer';
  $('#lblFee').hidden = t === 'income';
  $('#catFields').hidden = t === 'transfer';
  fillCategories();
}
formTx.type.addEventListener('change', syncTxType);
formTx.category.addEventListener('change', () => fillSubs());

async function openTx(t) {
  txAccounts = await getAll('accounts');
  const extra = t ? [t.accountId, t.toAccountId] : [];
  if (!txAccounts.some(a => !a.archived)) { alert('اول توی بخش حساب‌ها یه حساب بساز.'); return; }
  formTx.reset();
  editingTx = t ? t.id : null;
  editingTxRef = t ? (t.ref || null) : null;
  $('#txTitle').textContent = t ? 'ویرایش تراکنش' : 'تراکنش جدید';
  fillAccountSelects(extra);
  const [y, m, d] = t ? t.date : Jal.fromDayNum(Jal.todayNum());
  formTx.y.value = y; formTx.m.value = m; formTx.d.value = d;
  if (t) {
    formTx.type.value = t.type; syncTxType();
    formTx.accountId.value = t.accountId; if (t.toAccountId) formTx.toId.value = t.toAccountId;
    formTx.amount.value = t.amount.toLocaleString('en-US'); formTx.fee.value = t.fee.toLocaleString('en-US'); formTx.note.value = t.note || '';
    if (t.type !== 'transfer') fillCategories(t.category, t.sub);
  } else syncTxType();
  $('#errTx').textContent = '';
  dlgTx.showModal();
}
$('#cancelTx').onclick = () => dlgTx.close();
formTx.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formTx));
  const n = Object.fromEntries(['amount', 'fee', 'y', 'm', 'd'].map(k => [k, toInt(v[k] || '0')]));
  if (v.type === 'income') n.fee = 0;
  let err = '';
  if (Object.values(n).some(Number.isNaN)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1) err = 'مبلغ باید بیشتر از صفر باشه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ معتبر نیست.';
  else if (v.type === 'transfer' && v.accountId === v.toId) err = 'حساب مبدأ و مقصد نباید یکی باشن.';
  if (err) { $('#errTx').textContent = err; return; }
  const rec = { type: v.type, accountId: Number(v.accountId), amount: n.amount, fee: n.fee, note: v.note.trim(),
    date: [n.y, n.m, n.d], day: Jal.toDayNum(n.y, n.m, n.d), ref: editingTxRef };
  if (v.type === 'transfer') rec.toAccountId = Number(v.toId);
  else { rec.category = v.category; rec.sub = v.sub || ''; }
  if (editingTx) rec.id = editingTx;
  const accounts = await getAll('accounts');
  const rest = (await getAll('transactions')).filter(t => t.id !== editingTx);
  const neg = firstNegative(accounts, [...rest, rec]);
  if (neg) { $('#errTx').textContent = `با این تراکنش، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  await put('transactions', rec);
  dlgTx.close();
  render();
});
async function txAction(act, id) {
  const txs = await getAll('transactions');
  const t = txs.find(x => x.id === id);
  if (!t) return;
  if (act === 'txedit') return openTx(t);
  if (!confirm('این تراکنش حذف بشه؟')) return;
  const accounts = await getAll('accounts');
  const neg = firstNegative(accounts, txs.filter(x => x.id !== id));
  if (neg) { alert(`حذف این تراکنش مانده حساب «${neg.name}» رو منفی می‌کنه.`); return; }
  await del('transactions', id);
}

// ---- live thousands separator for .money inputs ----
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('money')) return;
  const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
  const digitsBefore = Util.norm(el.value.slice(0, caret)).replace(/\D/g, '').length;
  const digits = Util.norm(el.value).replace(/\D/g, '').slice(0, 15);
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (_) {}
});

// ---- start ----
(async () => {
  try { db = await openDb(); } catch (err) {
    $('#list').innerHTML = '<p class="empty">ذخیره‌سازی (IndexedDB) در این حالت کار نمی‌کنه.<br>فایل‌ها باید از آدرس HTTPS یا localhost باز بشن.</p>';
    return;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  render();
})();
