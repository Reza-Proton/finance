<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>مدیریت مالی</title>
<style>
@font-face{font-family:'Vazirmatn';src:local('Vazirmatn'),url('fonts/Vazirmatn-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#f3f5fa;--ink:#051438;--mut:#4a5678;--line:#d6dce9;--card:#ffffff;--acc:#0c6f3c;--onacc:#ffffff;--bad:#dc1c23;--warn:#8f5f00;--ok:#0c6f3c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#051438;--ink:#eef2fb;--mut:#a9b4d0;--line:#2d3a58;--card:#162446;--acc:#06a94d;--onacc:#051438;--bad:#e3636a;--warn:#e2b04a;--ok:#06a94d}}
:root[data-theme=dark]{--bg:#051438;--ink:#eef2fb;--mut:#a9b4d0;--line:#2d3a58;--card:#162446;--acc:#06a94d;--onacc:#051438;--bad:#e3636a;--warn:#e2b04a;--ok:#06a94d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Vazirmatn","Samsung Sans",Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto}
h1{margin:0;font-size:24px}
#summary{margin:4px 0 0;color:var(--mut);font-size:15px}
main{padding:8px 16px;display:grid;gap:12px;max-width:640px;margin:0 auto}
h3.sep{margin:12px 0 0;font-size:15px;color:var(--mut);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-right:6px solid var(--line);border-radius:10px;padding:12px 14px}
.card.bad{border-right-color:var(--bad)}.card.warn{border-right-color:var(--warn)}.card.ok{border-right-color:var(--ok)}.card.acc{border-right-color:var(--acc)}
.card.arch{opacity:.65}
.card h2{margin:0;font-size:17px}
.status{font-size:20px;font-weight:700;margin:2px 0}
.bad .status{color:var(--bad)}.warn .status{color:var(--warn)}.ok .status{color:var(--ok)}
.meta{color:var(--mut);font-size:14px}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
details{margin-top:12px}
summary{color:var(--mut);padding:8px 0;min-height:44px}
details .card{margin-top:12px}
.prow{margin-top:8px}
.dates2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.chk{display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:auto;min-height:0}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;min-height:44px}
button.main{background:var(--acc);color:var(--onacc);border-color:var(--acc);flex:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#add{position:fixed;inset-inline:16px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:608px;margin:auto;background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;min-height:56px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.empty{color:var(--mut);text-align:center;padding:40px 0}
dialog{width:min(92vw,420px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px;font-size:18px}
label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
.dates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.err{color:var(--bad);min-height:1.5em;font-size:14px}
[hidden]{display:none!important}
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.kv button{min-height:40px;padding:4px 10px;font-size:14px}
nav button{padding:8px 2px;font-size:14px}
.kv.tot{border-top:1px solid var(--line);font-weight:700;margin-top:6px}
.kv.sub{padding:2px 12px;color:var(--mut);font-size:14px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.cat>summary,.cat .catrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;list-style:none;min-height:0}
.cat .bar{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--acc)}
.plabel{margin:4px 0 0;font-size:18px}
select[data-rep]{width:auto}
@media print{
  :root,:root[data-theme],:root:not([data-theme=light]){--bg:#fff;--ink:#000;--mut:#444;--line:#bbb;--card:#fff;--acc:#0c6f3c;--bad:#dc1c23;--warn:#8f5f00;--ok:#0c6f3c}
  nav,#add,.noprint{display:none!important}
  body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{break-inside:avoid}
}
</style>
<script>
addEventListener('error', function (e) {
  var t = e.target, msg = (t && t.src) ? 'Failed to load: ' + t.src.split('/').pop() : 'Error: ' + e.message + ' (line ' + e.lineno + ')';
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;background:#b3341f;color:#fff;padding:8px;font:13px monospace;direction:ltr';
  d.textContent = msg; document.documentElement.appendChild(d);
}, true);
</script>

<main id="list"></main>
<button id="add"></button>
<nav id="nav"><button data-v="accounts">حساب‌ها</button><button data-v="tx">تراکنش‌ها</button><button data-v="loans">سررسیدها</button><button data-v="reports">گزارش‌ها</button><button data-v="settings">تنظیمات</button></nav>

<dialog id="dlgAcc">
<form id="formAcc">

<dialog id="dlgLoan">

<form id="formTx">

<script>
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const { toInt, validIban } = Util;
let db, view = 'accounts';

// ---- storage (IndexedDB) ----
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('finance', 6);
    r.onupgradeneeded = () => {
      for (const n of ['loans', 'accounts', 'transactions', 'recurring', 'checks'])
        if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id', autoIncrement: true });
      if (!r.result.objectStoreNames.contains('settings')) r.result.createObjectStore('settings', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = s => tx(s, 'readonly', o => o.getAll());
const put = (s, v) => tx(s, 'readwrite', o => o.put(v));
const del = (s, id) => tx(s, 'readwrite', o => o.delete(id));

// ---- navigation ----
async function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const V = { accounts: ['حساب‌ها', 'حساب جدید', renderAccounts], tx: ['تراکنش‌ها', 'تراکنش جدید', renderTx], loans: ['سررسیدها', 'افزودن', renderLoans], reports: ['گزارش‌ها', '', renderReports], settings: ['تنظیمات', '', renderSettings] }[view];
  $('#title').textContent = V[0];
  $('#add').textContent = V[1];
  $('#add').hidden = view === 'reports' || view === 'settings';
  await V[2]();
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (b) { view = b.dataset.v; render(); }
});
$('#add').onclick = () => ({ accounts: openAccount, tx: openTx, loans: openChoose }[view])();

// ================= ACCOUNTS =================
// Balance is always computed. Transactions will be added here later.
let BAL = new Map(), PEND = new Map();
const balance = a => (BAL.has(a.id) ? BAL.get(a.id) : a.opening);
const fmtIban = s => s.replace(/(.{4})/g, '$1 ').trim();

async function renderAccounts() {
  const all = await getAll('accounts');
  const txsAll = await getAll('transactions');
  BAL = computeBalances(all, txsAll);
  PEND = pendingByAccount(await getAll('checks'), txsAll);
  const active = all.filter(a => !a.archived), archived = all.filter(a => a.archived);
  $('#summary').textContent = active.length ? `جمع مانده‌ها: ${fa(active.reduce((s, a) => s + balance(a), 0))} ریال` : '';
  const card = a => `
    <article class="card acc ${a.archived ? 'arch' : ''}">
      <h2>${esc(a.name)} <span class="meta">· ${a.type === 'cash' ? 'نقد' : 'بانکی'}</span></h2>
      <div class="status">${fa(balance(a))} ریال</div>
      ${PEND.get(a.id) ? `<div class="meta">چک‌های در جریان: ${fa(PEND.get(a.id))} ریال</div>` : ''}
      ${a.number ? `<div class="meta">شماره حساب: <span class="ltr">${esc(a.number)}</span></div>` : ''}
      ${a.iban ? `<div class="meta">شبا: <span class="ltr">${fmtIban(a.iban)}</span></div>` : ''}
      <div class="row">
        <button data-act="edit" data-id="${a.id}">ویرایش</button>
        <button data-act="arch" data-id="${a.id}">${a.archived ? 'بازگردانی' : 'بایگانی'}</button>
      </div>
    </article>`;
  $('#list').innerHTML = all.length
    ? active.map(card).join('') + (archived.length ? '<h3 class="sep">بایگانی</h3>' + archived.map(card).join('') : '')
    : '<p class="empty">هنوز حسابی ثبت نکردی.<br>با دکمه «حساب جدید» شروع کن.</p>';
}

const dlgAcc = $('#dlgAcc'), formAcc = $('#formAcc');
let editingId = null;
function toggleBankFields() { $('#bankFields').hidden = formAcc.type.value !== 'bank'; }
formAcc.type.addEventListener('change', toggleBankFields);
function openAccount(a) {
  formAcc.reset();
  editingId = a ? a.id : null;
  $('#accTitle').textContent = a ? 'ویرایش حساب' : 'حساب جدید';
  if (a) {
    formAcc.name.value = a.name; formAcc.type.value = a.type; formAcc.opening.value = a.opening.toLocaleString('en-US');
    formAcc.number.value = a.number || ''; formAcc.iban.value = a.iban || '';
  }
  toggleBankFields();
  $('#errAcc').textContent = '';
  dlgAcc.showModal();
}
$('#cancelAcc').onclick = () => dlgAcc.close();
formAcc.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formAcc));
  const name = v.name.trim(), opening = toInt(v.opening);
  const all = await getAll('accounts');
  let err = '', iban = '';
  if (!name) err = 'نام حساب رو وارد کن.';
  else if (all.some(a => a.id !== editingId && a.name.trim().toLowerCase() === name.toLowerCase())) err = 'حسابی با این نام وجود داره.';
  else if (Number.isNaN(opening)) err = 'موجودی اولیه باید عدد صحیح و صفر یا بیشتر باشه.';
  if (!err && v.type === 'bank' && v.iban.trim()) {
    iban = validIban(v.iban);
    if (!iban) err = 'شماره شبا معتبر نیست. (IR و ۲۴ رقم)';
  }
  if (err) { $('#errAcc').textContent = err; return; }
  const old = editingId ? all.find(a => a.id === editingId) : null;
  const rec = { ...(old || {}), name, type: v.type, opening, archived: old ? old.archived : false,
    number: v.type === 'bank' ? Util.norm(v.number).trim() : '', iban: v.type === 'bank' ? iban : '' };
  if (old) {
    const neg = firstNegative(all.map(a => (a.id === rec.id ? rec : a)), await getAll('transactions'));
    if (neg) { $('#errAcc').textContent = `با این موجودی اولیه، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  }
  await put('accounts', rec);
  dlgAcc.close();
  render();
});
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.act;
  if (act.startsWith('set-')) { await settingsAction(act, b.dataset); render(); return; }
  if (act === 'nav-print') { window.print(); return; }
  if (act === 'nav-xlsx') { exportReportXlsx(); return; }
  if (act.startsWith('nav-')) { shiftPeriod(act === 'nav-next' ? 1 : -1); return; }
  if (act.startsWith('tx')) { await txAction(act, id); render(); return; }
  if (act.startsWith('r')) { await recAction(act, id); render(); return; }
  if (act.startsWith('c')) { await checkAction(act, id); render(); return; }
  if (act === 'edit' || act === 'arch') {
    const a = (await getAll('accounts')).find(x => x.id === id);
    if (!a) return;
    if (act === 'edit') return openAccount(a);
    if (!a.archived && balance(a) !== 0) { alert('برای بایگانی، مانده حساب باید صفر باشه. اول پول رو به حساب دیگه منتقل کن.'); return; }
    a.archived = !a.archived;
    await put('accounts', a);
  } else {
    await loanAction(act, id);
  }
  render();
});

// ================= LOANS =================
// A loan stores an anchor (paid count + next due month at entry time). Installment payments are
// expense transactions linked with ref = {kind:'loan', id}; paid count and next due are derived from them.
const addMonths = (y, m, k) => { const t = y * 12 + (m - 1) + k; return [Math.floor(t / 12), ((t % 12) + 12) % 12 + 1]; };
const linkedTx = (l, txs) => txs.filter(t => t.ref && t.ref.kind === 'loan' && t.ref.id === l.id);
function loanState(l, txs) {
  const k = linkedTx(l, txs).length;
  const [ay, am] = l.anchorDue || l.due; // l.due / l.paid: format of loans saved by older versions
  const [y, m] = addMonths(ay, am, k);
  return { k, paid: (l.anchorPaid != null ? l.anchorPaid : l.paid) + k, due: [y, m, Math.min(l.dueDay, Jal.monthDays(y, m))] };
}
const fmtDate = ([y, m, d]) => `${fa(d)} ${Jal.MONTHS[m - 1]} ${String(fa(y)).replace(/٬/g, '')}`;
function describe(due) {
  const diff = Jal.toDayNum(...due) - Jal.todayNum();
  if (diff < 0) return { diff, cls: 'bad', text: `${fa(-diff)} روز عقب‌افتاده` };
  if (diff === 0) return { diff, cls: 'bad', text: 'سررسید امروز' };
  if (diff <= 7) return { diff, cls: 'warn', text: `${fa(diff)} روز دیگه` };
  return { diff, cls: 'ok', text: `${fa(diff)} روز دیگه` };
}
const monthLabel = (y, m) => `${Jal.MONTHS[m - 1]} ${String(fa(y)).replace(/٬/g, '')}`;
// Recurring payment: one period per month; a period is done when a linked transaction exists or it was skipped.
function recState(r, txs) {
  const paid = new Set(txs.filter(t => t.ref && t.ref.kind === 'rec' && t.ref.id === r.id).map(t => t.ref.period));
  const skipped = new Set(r.skipped || []);
  const endIdx = r.end ? r.end[0] * 12 + r.end[1] : Infinity;
  let [y, m] = r.start, next = null, overdue = 0;
  for (let i = 0; i < 600; i++) {
    if (y * 12 + m > endIdx) break;
    const key = `${y}-${m}`;
    if (!paid.has(key) && !skipped.has(key)) {
      const due = [y, m, Math.min(r.dueDay, Jal.monthDays(y, m))];
      if (!next) next = { period: key, y, m, due };
      if (Jal.toDayNum(...due) < Jal.todayNum()) overdue++; else break;
    }
    [y, m] = addMonths(y, m, 1);
  }
  return { next, overdue };
}
async function renderLoans() {
  const [loans, recs, txs, checks, accts] = await Promise.all([getAll('loans'), getAll('recurring'), getAll('transactions'), getAll('checks'), getAll('accounts')]);
  const items = loans.map(l => { const st = loanState(l, txs); return { l, st, s: st.paid < l.total ? describe(st.due) : null }; });
  const active = items.filter(x => x.s).sort((a, b) => a.s.diff - b.s.diff);
  const done = items.filter(x => !x.s);
  const ritems = recs.map(r => { const st = recState(r, txs); return { r, st, s: st.next ? describe(st.next.due) : null }; });
  const ractive = ritems.filter(x => x.s).sort((a, b) => a.s.diff - b.s.diff);
  const rdone = ritems.filter(x => !x.s);
  const citems = checks.map(c => ({ c, status: checkStatus(c, txs), s: describe(c.due) }));
  const cactive = citems.filter(x => x.status === 'pending').sort((a, b) => a.s.diff - b.s.diff);
  const cdone = citems.filter(x => x.status !== 'pending').sort((a, b) => b.c.day - a.c.day);
  const urgent = active.filter(x => x.s.diff <= 7).length + ractive.filter(x => x.s.diff <= 7).length + cactive.filter(x => x.s.diff <= 7).length;
  $('#summary').textContent = !(loans.length + recs.length + checks.length) ? '' : urgent ? `${fa(urgent)} مورد تا ۷ روز آینده یا عقب‌افتاده` : 'سررسیدی تا ۷ روز آینده نداری';
  const card = ({ l, st, s }) => `
    <article class="card ${s ? s.cls : ''}">
      <h2>${esc(l.title)}</h2>
      ${s ? `<div class="status">${s.text}</div><div class="meta">سررسید ${fmtDate(st.due)} · مبلغ ${fa(l.amount)} ریال</div>` : `<div class="status">تسویه شد</div>`}
      <div class="meta">${fa(st.paid)} از ${fa(l.total)} قسط پرداخت شده${s ? ` · مانده ${fa((l.total - st.paid) * l.amount)} ریال` : ''}</div>
      ${l.principal ? `<div class="meta">مبلغ کل وام: ${fa(l.principal)} ریال</div>` : ''}
      <div class="row">
        ${s ? `<button class="main" data-act="pay" data-id="${l.id}">پرداخت قسط</button>` : ''}
        <button data-act="ledit" data-id="${l.id}">ویرایش</button>
        <button data-act="del" data-id="${l.id}">حذف</button>
      </div>
    </article>`;
  const rcard = ({ r, st, s }) => `
    <article class="card ${s ? s.cls : ''}">
      <h2>${esc(r.title)}</h2>
      ${s ? `<div class="status">${s.text}${st.overdue > 1 ? ` · ${fa(st.overdue)} ماه پرداخت‌نشده` : ''}</div>
        <div class="meta">${monthLabel(st.next.y, st.next.m)} · سررسید ${fmtDate(st.next.due)} · مبلغ ${fa(r.amount)} ریال</div>`
        : `<div class="status">پایان یافته</div>`}
      <div class="meta">${esc(r.category)}${r.sub ? ' · ' + esc(r.sub) : ''}</div>
      <div class="row">
        ${s ? `<button class="main" data-act="rpay" data-id="${r.id}">پرداخت</button><button data-act="rskip" data-id="${r.id}">رد شدن این ماه</button>` : ''}
        <button data-act="redit" data-id="${r.id}">ویرایش</button>
        <button data-act="rdel" data-id="${r.id}">حذف</button>
      </div>
    </article>`;
  const loansHtml = active.map(card).join('') + done.map(card).join('');
  const recHtml = ractive.map(rcard).join('') + rdone.map(rcard).join('');
  const nameOf = id => (accts.find(a => a.id === id) || {}).name || '؟';
  const ccard = ({ c, status, s }) => `
    <article class="card ${status === 'pending' ? s.cls : status === 'cleared' ? 'acc' : 'arch'}">
      <h2>چک ${esc(c.serial)}${c.payee ? ' · ' + esc(c.payee) : ''}</h2>
      <div class="status">${status === 'pending' ? s.text : status === 'cleared' ? 'پاس شد' : 'باطل شد'}</div>
      <div class="meta">سررسید ${fmtDate(c.due)} · مبلغ ${fa(c.amount)} ریال · ${esc(nameOf(c.accountId))}</div>
      <div class="meta">${esc(c.category)}${c.sub ? ' · ' + esc(c.sub) : ''}</div>
      ${c.note ? `<div class="meta">${esc(c.note)}</div>` : ''}
      <div class="row">
        ${status === 'pending' ? `<button class="main" data-act="cclear" data-id="${c.id}">پاس شد</button><button data-act="cedit" data-id="${c.id}">ویرایش</button><button data-act="ccancel" data-id="${c.id}">باطل شد</button>` : ''}
        ${status === 'cancelled' ? `<button data-act="crestore" data-id="${c.id}">بازگردانی</button>` : ''}
        <button data-act="cdel" data-id="${c.id}">حذف</button>
      </div>
    </article>`;
  const checkHtml = cactive.map(ccard).join('')
    + (cdone.length ? `<details><summary>چک‌های پاس‌شده و باطل‌شده (${fa(cdone.length)})</summary>${cdone.map(ccard).join('')}</details>` : '');
  $('#list').innerHTML = (loans.length + recs.length + checks.length)
    ? (loansHtml ? '<h3 class="sep">وام‌ها</h3>' + loansHtml : '') + (recHtml ? '<h3 class="sep">پرداخت‌های دوره‌ای</h3>' + recHtml : '')
      + (checkHtml ? '<h3 class="sep">چک‌ها</h3>' + checkHtml : '')
    : '<p class="empty">هنوز وام، پرداخت دوره‌ای یا چکی ثبت نکردی.<br>با دکمه «افزودن» شروع کن.</p>';
}
async function loanAction(act, id) {
  const [loans, txs] = await Promise.all([getAll('loans'), getAll('transactions')]);
  const l = loans.find(x => x.id === id);
  if (!l) return;
  if (act === 'pay') return openPay(l, loanState(l, txs));
  if (act === 'ledit') return openLoan(l);
  if (act === 'del' && confirm(`وام «${l.title}» حذف بشه؟ تراکنش‌های پرداخت قسط حذف نمی‌شن.`)) {
    for (const t of linkedTx(l, txs)) await put('transactions', { ...t, ref: null });
    await del('loans', id);
  }
}

// ---- add / edit loan ----
const dlgLoan = $('#dlgLoan'), formLoan = $('#formLoan');
let editingLoan = null;
async function openLoan(l) {
  formLoan.reset();
  editingLoan = l ? l.id : null;
  $('#loanTitle').textContent = l ? 'ویرایش وام' : 'وام جدید';
  let date = Jal.fromDayNum(Jal.todayNum());
  if (l) {
    const st = loanState(l, await getAll('transactions'));
    formLoan.title.value = l.title;
    formLoan.principal.value = l.principal ? l.principal.toLocaleString('en-US') : '';
    formLoan.amount.value = l.amount.toLocaleString('en-US');
    formLoan.total.value = l.total; formLoan.paid.value = st.paid;
    date = st.due;
  }
  formLoan.y.value = date[0]; formLoan.m.value = date[1]; formLoan.d.value = date[2];
  $('#errLoan').textContent = '';
  dlgLoan.showModal();
}
$('#cancelLoan').onclick = () => dlgLoan.close();
formLoan.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formLoan));
  const n = Object.fromEntries(['amount', 'total', 'paid', 'y', 'm', 'd'].map(k => [k, toInt(v[k])]));
  const principal = v.principal.trim() ? toInt(v.principal) : 0;
  let err = '';
  if (Object.values(n).some(Number.isNaN) || Number.isNaN(principal)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1 || n.total < 1) err = 'مبلغ قسط و تعداد اقساط باید بیشتر از صفر باشه.';
  else if (n.paid > n.total) err = 'اقساط پرداخت‌شده بیشتر از کل اقساطه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ سررسید معتبر نیست.';
  let k = 0;
  if (!err && editingLoan) {
    const loan = (await getAll('loans')).find(x => x.id === editingLoan);
    k = linkedTx(loan, await getAll('transactions')).length;
    if (n.paid < k) err = `تعداد پرداخت‌شده نمی‌تونه کمتر از ${fa(k)} باشه، چون ${fa(k)} قسط از طریق تراکنش ثبت شده.`;
  }
  if (err) { $('#errLoan').textContent = err; return; }
  const rec = { title: v.title.trim(), principal, amount: n.amount, total: n.total,
    anchorPaid: n.paid - k, anchorDue: addMonths(n.y, n.m, -k), dueDay: n.d };
  if (editingLoan) rec.id = editingLoan;
  await put('loans', rec);
  dlgLoan.close();
  render();
});

// ---- pay an installment (creates a linked expense transaction) ----
const dlgPay = $('#dlgPay'), formPay = $('#formPay');
let payCtx = null;
async function openPay(l, st) {
  const [accounts, txs] = await Promise.all([getAll('accounts'), getAll('transactions')]);
  const bal = computeBalances(accounts, txs);
  const active = accounts.filter(a => !a.archived);
  if (!active.length) { alert('اول توی بخش حساب‌ها یه حساب بساز.'); return; }
  payCtx = { kind: 'loan', l, st };
  formPay.reset(); formPay.amount.readOnly = false;
  formPay.account.innerHTML = active.map(a => `<option value="${a.id}">${esc(a.name)} (مانده ${fa(bal.get(a.id))})</option>`).join('');
  formPay.amount.value = l.amount.toLocaleString('en-US');
  const [y, m, d] = Jal.fromDayNum(Jal.todayNum());
  formPay.y.value = y; formPay.m.value = m; formPay.d.value = d;
  $('#payTitle').textContent = `قسط ${fa(st.paid + 1)} از ${fa(l.total)} · ${l.title}`;
  $('#errPay').textContent = '';
  dlgPay.showModal();
}
$('#cancelPay').onclick = () => dlgPay.close();
formPay.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formPay));
  const n = Object.fromEntries(['amount', 'fee', 'y', 'm', 'd'].map(k => [k, toInt(v[k] || '0')]));
  let err = '';
  if (Object.values(n).some(Number.isNaN)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1) err = 'مبلغ باید بیشتر از صفر باشه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ معتبر نیست.';
  if (err) { $('#errPay').textContent = err; return; }
  const base = { type: 'expense', accountId: Number(v.account), amount: n.amount, fee: n.fee,
    date: [n.y, n.m, n.d], day: Jal.toDayNum(n.y, n.m, n.d) };
  const rec = payCtx.kind === 'check'
    ? { ...base, amount: payCtx.c.amount, note: `چک ${payCtx.c.serial}${payCtx.c.payee ? ' · ' + payCtx.c.payee : ''}`, category: payCtx.c.category, sub: payCtx.c.sub || '',
        ref: { kind: 'check', id: payCtx.c.id } }
    : payCtx.kind === 'rec'
    ? { ...base, note: `${payCtx.r.title} · ${monthLabel(payCtx.next.y, payCtx.next.m)}`, category: payCtx.r.category, sub: payCtx.r.sub || '',
        ref: { kind: 'rec', id: payCtx.r.id, period: payCtx.next.period } }
    : { ...base, note: `${payCtx.l.title} · قسط ${fa(payCtx.st.paid + 1)} از ${fa(payCtx.l.total)}`,
        category: 'اقساط و بدهی‌ها', sub: 'قسط', ref: { kind: 'loan', id: payCtx.l.id } };
  const accounts = await getAll('accounts');
  const neg = firstNegative(accounts, [...(await getAll('transactions')), rec]);
  if (neg) { $('#errPay').textContent = `با این پرداخت، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  await put('transactions', rec);
  dlgPay.close();
  render();
});

let editingRec = null;
function fillRecSubs(keepSub) {
  const subs = CATS.expense[formRec.category.value] || [];
  formRec.sub.innerHTML = subs.map(s => `<option>${esc(s)}</option>`).join('');
  if (keepSub && subs.includes(keepSub)) formRec.sub.value = keepSub;
  $('#lblRecSub').hidden = !subs.length;
}
formRec.category.addEventListener('change', () => fillRecSubs());
async function openRec(r) {
  const accounts = (await getAll('accounts')).filter(a => !a.archived);
  formRec.reset();
  editingRec = r ? r.id : null;
  $('#recTitle').textContent = r ? 'ویرایش پرداخت دوره‌ای' : 'پرداخت دوره‌ای جدید';
  formRec.category.innerHTML = Object.keys(CATS.expense).map(c => `<option>${esc(c)}</option>`).join('');
  formRec.accountId.innerHTML = '<option value="">— بدون پیش‌فرض —</option>' + accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  const [ty, tm] = Jal.fromDayNum(Jal.todayNum());
  formRec.sy.value = ty; formRec.sm.value = tm;
  if (r) {
    formRec.title.value = r.title; formRec.amount.value = r.amount.toLocaleString('en-US');
    formRec.category.value = r.category; fillRecSubs(r.sub);

$('#cancelRec').onclick = () => dlgRec.close();
formRec.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formRec));
  const n = Object.fromEntries(['amount', 'dueDay', 'sy', 'sm'].map(k => [k, toInt(v[k])]));
  const hasEnd = v.ey.trim() || v.em.trim();
  const ey = hasEnd ? toInt(v.ey) : 0, em = hasEnd ? toInt(v.em) : 0;
  let err = '';
  if (Object.values(n).some(Number.isNaN) || Number.isNaN(ey) || Number.isNaN(em)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1) err = 'مبلغ باید بیشتر از صفر باشه.';
  else if (n.dueDay < 1 || n.dueDay > 31) err = 'روز سررسید باید بین ۱ تا ۳۱ باشه.';
  else if (n.sm < 1 || n.sm > 12 || n.sy < 1300) err = 'ماه شروع معتبر نیست.';
  else if (hasEnd && (em < 1 || em > 12 || ey < 1300)) err = 'ماه پایان معتبر نیست.';
  else if (hasEnd && ey * 12 + em < n.sy * 12 + n.sm) err = 'ماه پایان نباید قبل از ماه شروع باشه.';
  if (err) { $('#errRec').textContent = err; return; }
  let skipped = [];
  if (editingRec) {
    const old = (await getAll('recurring')).find(x => x.id === editingRec);
    skipped = v.clearSkipped ? [] : (old.skipped || []);
  }
  const rec = { title: v.title.trim(), amount: n.amount, category: v.category, sub: v.sub || '',
    accountId: v.accountId ? Number(v.accountId) : null, dueDay: n.dueDay, start: [n.sy, n.sm], end: hasEnd ? [ey, em] : null, skipped };
  if (editingRec) rec.id = editingRec;
  await put('recurring', rec);
  dlgRec.close();
  render();
});
async function openPayRec(r, next) {
  const [accounts, txs] = await Promise.all([getAll('accounts'), getAll('transactions')]);
  const bal = computeBalances(accounts, txs);
  const active = accounts.filter(a => !a.archived);
  if (!active.length) { alert('اول توی بخش حساب‌ها یه حساب بساز.'); return; }
  payCtx = { kind: 'rec', r, next };
  formPay.reset(); formPay.amount.readOnly = false;
  formPay.account.innerHTML = active.map(a => `<option value="${a.id}">${esc(a.name)} (مانده ${fa(bal.get(a.id))})</option>`).join('');
  if (r.accountId && active.some(a => a.id === r.accountId)) formPay.account.value = r.accountId;

// Saves one cash expense + N pending checks in a single atomic IndexedDB transaction.
function putMany(entries) {
  return new Promise((res, rej) => {
    const t = db.transaction([...new Set(entries.map(e => e[0]))], 'readwrite');
    for (const [s, v] of entries) t.objectStore(s).put(v);
    t.oncomplete = () => res();
    t.onerror = t.onabort = () => rej(t.error);
  });
}

const STORES = ['accounts', 'transactions', 'loans', 'recurring', 'checks'];
const SHAPE = {
  accounts: r => typeof r.name === 'string' && Number.isFinite(r.opening),
  transactions: r => ['income', 'expense', 'transfer'].includes(r.type) && Number.isFinite(r.amount) && Number.isFinite(r.fee) && Number.isFinite(r.day) && Array.isArray(r.date),
  loans: r => typeof r.title === 'string' && Number.isFinite(r.amount) && Number.isFinite(r.total),
  recurring: r => typeof r.title === 'string' && Array.isArray(r.start),
  checks: r => typeof r.serial === 'string' && Number.isFinite(r.amount) && Number.isFinite(r.day)
};
const validBackup = o => !!o && o.app === 'finance-pwa' && !!o.stores
  && STORES.every(s => Array.isArray(o.stores[s]) && o.stores[s].every(r => r && typeof r === 'object' && Number.isInteger(r.id) && SHAPE[s](r)));
const validCats = c => !!c && ['expense', 'income'].every(k => c[k] && typeof c[k] === 'object' && Object.keys(c[k]).length > 0
  && Object.values(c[k]).every(a => Array.isArray(a) && a.every(x => typeof x === 'string')));

function replaceAll(data, categories) {
  return new Promise((res, rej) => {
    const t = db.transaction([...STORES, 'settings'], 'readwrite');
    for (const s of STORES) { const o = t.objectStore(s); o.clear(); for (const r of data[s]) o.put(r); }
    if (categories) t.objectStore('settings').put({ key: 'categories', value: categories });
    t.oncomplete = () => res();
    t.onerror = t.onabort = () => rej(t.error);
  });
}

}

  return list;
}
async function settingsAction(act, ds) {
  if (act === 'set-backup') return doBackup();
  if (act === 'set-restore') { $('#restoreFile').click(); return; }
  if (act.startsWith('set-theme-')) { setTheme(act.slice(10)); return; }
  const { kind, cat, sub } = ds;
  const next = JSON.parse(JSON.stringify(CATS)), cats = next[kind];
  const ask = (msg, def) => (prompt(msg, def || '') || '').trim();
  const save = async entries => { await putMany([...entries, ['settings', { key: 'categories', value: next }]]); window.CATS = next; };
  const locked = kind === 'expense' && cat === 'اقساط و بدهی‌ها' && (act.startsWith('set-cat') || sub === 'قسط');
  if (act !== 'set-catadd' && act !== 'set-subadd' && locked) { alert('این دسته برای ثبت اقساط وام لازمه و قابل تغییر نیست.'); return; }
  if (act === 'set-catadd') {
    const n = ask('نام دسته‌ی جدید:');
    if (!n) return;
    if (cats[n] || n === 'کارمزد') { alert('این نام قبلاً هست.'); return; }
    cats[n] = []; return save([]);
  }
  if (act === 'set-catren') {
    const n = ask('نام جدید دسته:', cat);
    if (!n || n === cat) return;
    if (cats[n] || n === 'کارمزد') { alert('این نام قبلاً هست.'); return; }
    const entries = (await catUsage(kind, cat)).map(([s, r]) => [s, { ...r, category: n }]);
    next[kind] = Object.fromEntries(Object.entries(cats).map(([k, v]) => [k === cat ? n : k, v]));
    return save(entries);
  }
  if (act === 'set-catdel') {
    if (Object.keys(cats).length < 2) { alert('حداقل یک دسته باید بمونه.'); return; }
    const used = await catUsage(kind, cat);
    if (used.length) { alert(`این دسته توی ${fa(used.length)} مورد استفاده شده. اول اون‌ها رو به دسته‌ی دیگه ببر.`); return; }
    if (!confirm(`دسته‌ی «${cat}» حذف بشه؟`)) return;
    delete cats[cat]; return save([]);
  }
  if (act === 'set-subadd') {
    const n = ask(`نام زیردسته‌ی جدید برای «${cat}»:`);
    if (!n) return;
    if (cats[cat].includes(n)) { alert('این زیردسته قبلاً هست.'); return; }
    cats[cat].push(n); return save([]);
  }
  if (act === 'set-subren') {
    const n = ask('نام جدید زیردسته:', sub);
    if (!n || n === sub) return;
    if (cats[cat].includes(n)) { alert('این زیردسته قبلاً هست.'); return; }
    const entries = (await catUsage(kind, cat, sub)).map(([s, r]) => [s, { ...r, sub: n }]);
    cats[cat] = cats[cat].map(x => (x === sub ? n : x));
    return save(entries);
  }
  if (act === 'set-subdel') {
    const used = await catUsage(kind, cat, sub);
    if (used.length) { alert(`این زیردسته توی ${fa(used.length)} مورد استفاده شده. اول اون‌ها رو تغییر بده.`); return; }
    if (!confirm(`زیردسته‌ی «${sub}» حذف بشه؟`)) return;
    cats[cat] = cats[cat].filter(x => x !== sub); return save([]);
  }
}

let REP = (() => { const [y, m] = Jal.fromDayNum(Jal.todayNum()); return { mode: 'month', y, m }; })();
function shiftPeriod(k) {
  if (REP.mode === 'year') REP.y += k; else [REP.y, REP.m] = addMonths(REP.y, REP.m, k);
  render();
}
$('#list').addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.rep === 'mode') { REP.mode = e.target.value; render(); }
});
addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => { d.open = true; }));

const yr = y => String(fa(y)).replace(/٬/g, '');
function periodRange(p) {
  return p.mode === 'year'
    ? { from: Jal.toDayNum(p.y, 1, 1), to: Jal.toDayNum(p.y, 12, Jal.monthDays(p.y, 12)) }
    : { from: Jal.toDayNum(p.y, p.m, 1), to: Jal.toDayNum(p.y, p.m, Jal.monthDays(p.y, p.m)) };
}
// Cash basis: only transactions count. Fees are reported as a separate expense category.
function reportData(txs, from, to) {
  let income = 0, expense = 0;
  const expCat = new Map(), incCat = new Map();
  const add = (map, cat, sub, v) => {
    const e = map.get(cat) || { total: 0, subs: new Map() };
    e.total += v;
    if (sub) e.subs.set(sub, (e.subs.get(sub) || 0) + v);
    map.set(cat, e);
  };
  for (const t of txs) {
    if (t.day < from || t.day > to) continue;
    if (t.type === 'income') { income += t.amount; add(incCat, t.category, t.sub, t.amount); continue; }
    if (t.type === 'expense') { expense += t.amount; add(expCat, t.category, t.sub, t.amount); }
    if (t.fee) { expense += t.fee; add(expCat, 'کارمزد', '', t.fee); }
  }
  return { income, expense, expCat, incCat };
}
function monthlyTrend(txs, year) {
  const inc = Array(12).fill(0), exp = Array(12).fill(0);
  for (const t of txs) {
    if (t.date[0] !== year) continue;
    const i = t.date[1] - 1;
    if (t.type === 'income') inc[i] += t.amount;
    else exp[i] += (t.type === 'expense' ? t.amount : 0) + t.fee;
  }
  return { inc, exp };
}
function duesInRange(loans, recs, checks, txs, from, to) {
  const rows = [];
  for (const l of loans) {
    const st = loanState(l, txs);
    for (let j = 0; j < l.total - st.paid; j++) {
      const [y, m] = addMonths(st.due[0], st.due[1], j);
      const day = Jal.toDayNum(y, m, Math.min(l.dueDay, Jal.monthDays(y, m)));
      if (day > to) break;
      if (day >= from) rows.push({ day, kind: 'قسط وام', title: l.title, amount: l.amount });
    }
  }
  for (const r of recs) {
    const paid = new Set(txs.filter(t => t.ref && t.ref.kind === 'rec' && t.ref.id === r.id).map(t => t.ref.period));
    const skipped = new Set(r.skipped || []);
    const endIdx = r.end ? r.end[0] * 12 + r.end[1] : Infinity;
    let [y, m] = r.start;
    for (let i = 0; i < 600 && y * 12 + m <= endIdx; i++) {
      const day = Jal.toDayNum(y, m, Math.min(r.dueDay, Jal.monthDays(y, m)));
      if (day > to) break;
      if (day >= from && !paid.has(`${y}-${m}`) && !skipped.has(`${y}-${m}`)) rows.push({ day, kind: 'پرداخت دوره‌ای', title: r.title, amount: r.amount });
      [y, m] = addMonths(y, m, 1);
    }
  }
  for (const c of checks) {
    if (checkStatus(c, txs) === 'pending' && c.day >= from && c.day <= to)
      rows.push({ day: c.day, kind: 'چک', title: `چک ${c.serial}` + (c.payee ? ' · ' + c.payee : ''), amount: c.amount });
  }
  return rows.sort((a, b) => a.day - b.day);
}

function catSection(title, map, total) {
  const rows = [...map.entries()].sort((a, b) => b[1].total - a[1].total);
  if (!rows.length) return `<section class="card"><h2>${title}</h2><div class="meta">داده‌ای برای این دوره نیست.</div></section>`;
  const pct = v => (total ? (v / total) * 100 : 0);
  const fmtPct = p => p.toLocaleString('fa-IR', { maximumFractionDigits: 1 }) + '٪';
  const body = rows.map(([cat, e]) => {
    const subs = [...e.subs.entries()].sort((a, b) => b[1] - a[1]);
    const rest = e.total - subs.reduce((s, x) => s + x[1], 0);
    if (rest > 0 && subs.length) subs.push(['بدون زیردسته', rest]);
    const head = `<span>${esc(cat)}</span><span>${fa(e.total)} · ${fmtPct(pct(e.total))}</span><span class="bar"><i style="width:${pct(e.total).toFixed(1)}%"></i></span>`;
    return subs.length
      ? `<details class="cat"><summary>${head}</summary>${subs.map(([s, v]) => `<div class="kv sub"><span>${esc(s)}</span><span>${fa(v)}</span></div>`).join('')}</details>`
      : `<div class="cat"><div class="catrow">${head}</div></div>`;
  }).join('');
  return `<section class="card"><h2>${title}</h2>${body}<div class="kv tot"><span>جمع</span><span>${fa(total)} ریال</span></div></section>`;
}
function trendSvg(inc, exp) {
  const max = Math.max(1, ...inc, ...exp), W = 360, H = 150, gw = W / 12, bw = 9;
  let s = '';
  for (let i = 0; i < 12; i++) {
    const x = gw * (11 - i) + gw / 2; // month 1 on the right (RTL)
    const hi = (inc[i] / max) * H, he = (exp[i] / max) * H;
    s += `<rect x="${(x - bw - 1).toFixed(1)}" y="${(H - hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" style="fill:var(--ok)"/>`
      + `<rect x="${(x + 1).toFixed(1)}" y="${(H - he).toFixed(1)}" width="${bw}" height="${he.toFixed(1)}" style="fill:var(--bad)"/>`
      + `<text x="${x.toFixed(1)}" y="${H + 14}" text-anchor="middle" font-size="10" style="fill:var(--mut)">${fa(i + 1)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H + 20}" width="100%" role="img" aria-label="نمودار میله‌ای درآمد و هزینه‌ی ماهانه">${s}</svg>`;
}

function reportSheets(d) {
  const { txs, accounts, loans, recs, checks, rep } = d;
  const { from, to } = periodRange(rep);
  const label = rep.mode === 'year' ? `سال ${yr(rep.y)}` : monthLabel(rep.y, rep.m);
  const R = reportData(txs, from, to);
  const B = x => ({ v: x, b: true });
  const dstr = ([y, m, dd]) => `${y}/${String(m).padStart(2, '0')}/${String(dd).padStart(2, '0')}`;
  const nm = id => (accounts.find(a => a.id === id) || {}).name || '';
  const catRows = (map, total) => {
    const rows = [[B('دسته‌بندی'), B('زیردسته'), B('مبلغ (ریال)'), B('درصد')]];
    const pct = v => (total ? { v: Math.round((v / total) * 1000) / 10, p: true } : '');
    for (const [cat, e] of [...map.entries()].sort((a, b) => b[1].total - a[1].total)) {
      rows.push([B(cat), '', B(e.total), pct(e.total)]);
      const subs = [...e.subs.entries()].sort((a, b) => b[1] - a[1]);
      const rest = e.total - subs.reduce((s, x) => s + x[1], 0);
      if (rest > 0 && subs.length) subs.push(['بدون زیردسته', rest]);
      for (const [s, v] of subs) rows.push(['', s, v, pct(v)]);
    }
    rows.push([B('جمع'), '', B(total)]);
    return rows;
  };
  const TL = { income: 'درآمد', expense: 'هزینه', transfer: 'انتقال' };
  const trows = [[B('تاریخ'), B('نوع'), B('دسته‌بندی'), B('زیردسته'), B('حساب'), B('حساب مقصد'), B('مبلغ'), B('کارمزد'), B('توضیح')]];
  for (const t of txs.filter(t => t.day >= from && t.day <= to).sort((a, b) => a.day - b.day || a.id - b.id))
    trows.push([dstr(t.date), TL[t.type], t.category || '', t.sub || '', nm(t.accountId), t.type === 'transfer' ? nm(t.toAccountId) : '', t.amount, t.fee || 0, t.note || '']);

  const ti = T.inc.reduce((s, x) => s + x, 0), te = T.exp.reduce((s, x) => s + x, 0);

  const dues = duesInRange(loans, recs, checks, txs, from, to);

  const bal = computeBalances(accounts, txs), pend = pendingByAccount(checks, txs);

  brows.push([B('جمع'), '', B(act.reduce((s, a) => s + bal.get(a.id), 0)), B(act.reduce((s, a) => s + (pend.get(a.id) || 0), 0))]);
  return [
    { name: 'خلاصه', widths: [30, 22], rows: [[B('گزارش مالی'), label], [], [B('درآمد'), R.income], [B('هزینه (با کارمزدها)'), R.expense], [B('سود / زیان'), B(R.income - R.expense)]] },
    { name: 'هزینه‌ها', widths: [24, 24, 18, 10], rows: catRows(R.expCat, R.expense) },
    { name: 'درآمدها', widths: [24, 24, 18, 10], rows: catRows(R.incCat, R.income) },
    { name: 'تراکنش‌ها', widths: [12, 10, 22, 22, 18, 18, 16, 12, 40], rows: trows },
    { name: `ماهانه ${rep.y}`, widths: [14, 18, 18, 18], rows: mrows },
    { name: 'سررسیدها', widths: [12, 16, 34, 16], rows: drows },

  ];
}
function downloadBlob(name, bytes, mime) {

  document.body.appendChild(a); a.click(); a.remove();

}

// ================= TRANSACTIONS =================
// Balance = opening + income - expense(amount+fee) - transfer out(amount+fee) + transfer in(amount)
function computeBalances(accounts, txs) {
  const m = new Map(accounts.map(a => [a.id, a.opening]));
  const add = (id, v) => m.set(id, (m.get(id) || 0) + v);
  for (const t of txs) {
    if (t.type === 'income') add(t.accountId, t.amount);
    else if (t.type === 'expense') add(t.accountId, -(t.amount + t.fee));
    else { add(t.accountId, -(t.amount + t.fee)); add(t.toAccountId, t.amount); }
  }
  return m;
}
function firstNegative(accounts, txs) {
  const m = computeBalances(accounts, txs);
  return accounts.find(a => m.get(a.id) < 0);
}
const fmtFull = ([y, m, d]) => `${fa(d)} ${Jal.MONTHS[m - 1]} ${String(fa(y)).replace(/٬/g, '')}`;

  const cats = Object.keys(CATS[t]);
  formTx.category.innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
  if (keepCat && cats.includes(keepCat)) formTx.category.value = keepCat;
  fillSubs(keepSub);
}
function fillSubs(keepSub) {
  const subs = CATS[formTx.type.value][formTx.category.value] || [];
  formTx.sub.innerHTML = subs.map(s => `<option>${esc(s)}</option>`).join('');
  if (keepSub && subs.includes(keepSub)) formTx.sub.value = keepSub;
  $('#lblSub').hidden = !subs.length;
}
function syncTxType() {
  const t = formTx.type.value;
  $('#lblAcc').textContent = t === 'income' ? 'به حساب' : 'از حساب';
  $('#lblTo').hidden = t !== 'transfer';
  $('#lblFee').hidden = t === 'income';
  $('#catFields').hidden = t === 'transfer';
  fillCategories();
}
formTx.type.addEventListener('change', syncTxType);
formTx.category.addEventListener('change', () => fillSubs());

async function openTx(t) {
  txAccounts = await getAll('accounts');
  const extra = t ? [t.accountId, t.toAccountId] : [];
  if (!txAccounts.some(a => !a.archived)) { alert('اول توی بخش حساب‌ها یه حساب بساز.'); return; }
  formTx.reset();
  editingTx = t ? t.id : null;
  editingTxRef = t ? (t.ref || null) : null;
  $('#txTitle').textContent = t ? 'ویرایش تراکنش' : 'تراکنش جدید';
  fillAccountSelects(extra);
  const [y, m, d] = t ? t.date : Jal.fromDayNum(Jal.todayNum());
  formTx.y.value = y; formTx.m.value = m; formTx.d.value = d;
  if (t) {
    formTx.type.value = t.type; syncTxType();
    formTx.accountId.value = t.accountId; if (t.toAccountId) formTx.toId.value = t.toAccountId;
    formTx.amount.value = t.amount.toLocaleString('en-US'); formTx.fee.value = t.fee.toLocaleString('en-US'); formTx.note.value = t.note || '';
    if (t.type !== 'transfer') fillCategories(t.category, t.sub);
  } else syncTxType();
  $('#errTx').textContent = '';
  dlgTx.showModal();
}
$('#cancelTx').onclick = () => dlgTx.close();
formTx.addEventListener('submit', async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(formTx));
  const n = Object.fromEntries(['amount', 'fee', 'y', 'm', 'd'].map(k => [k, toInt(v[k] || '0')]));
  if (v.type === 'income') n.fee = 0;
  let err = '';
  if (Object.values(n).some(Number.isNaN)) err = 'همه عددها باید صحیح باشن.';
  else if (n.amount < 1) err = 'مبلغ باید بیشتر از صفر باشه.';
  else if (n.m < 1 || n.m > 12 || n.d < 1 || n.d > Jal.monthDays(n.y, n.m)) err = 'تاریخ معتبر نیست.';
  else if (v.type === 'transfer' && v.accountId === v.toId) err = 'حساب مبدأ و مقصد نباید یکی باشن.';
  if (err) { $('#errTx').textContent = err; return; }
  const rec = { type: v.type, accountId: Number(v.accountId), amount: n.amount, fee: n.fee, note: v.note.trim(),
    date: [n.y, n.m, n.d], day: Jal.toDayNum(n.y, n.m, n.d), ref: editingTxRef };
  if (v.type === 'transfer') rec.toAccountId = Number(v.toId);
  else { rec.category = v.category; rec.sub = v.sub || ''; }
  if (editingTx) rec.id = editingTx;
  const accounts = await getAll('accounts');
  const rest = (await getAll('transactions')).filter(t => t.id !== editingTx);
  const neg = firstNegative(accounts, [...rest, rec]);
  if (neg) { $('#errTx').textContent = `با این تراکنش، مانده حساب «${neg.name}» منفی می‌شه.`; return; }
  await put('transactions', rec);
  dlgTx.close();
  render();
});
async function txAction(act, id) {
  const txs = await getAll('transactions');
  const t = txs.find(x => x.id === id);
  if (!t) return;
  if (act === 'txedit') return openTx(t);
  if (!confirm('این تراکنش حذف بشه؟')) return;
  const accounts = await getAll('accounts');
  const neg = firstNegative(accounts, txs.filter(x => x.id !== id));
  if (neg) { alert(`حذف این تراکنش مانده حساب «${neg.name}» رو منفی می‌کنه.`); return; }
  await del('transactions', id);
}

// ---- live thousands separator for .money inputs ----
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('money')) return;
  const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
  const digitsBefore = Util.norm(el.value.slice(0, caret)).replace(/\D/g, '').length;
  const digits = Util.norm(el.value).replace(/\D/g, '').slice(0, 15);
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
  let pos = 0, seen = 0;
  while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (_) {}
});

// ---- start ----
(async () => {
  try { db = await openDb(); } catch (err) {
    $('#list').innerHTML = '<p class="empty">ذخیره‌سازی (IndexedDB) در این حالت کار نمی‌کنه.<br>فایل‌ها باید از آدرس HTTPS یا localhost باز بشن.</p>';
    return;
  }
  try {
    const s = await tx('settings', 'readonly', o => o.get('categories'));
    if (s && validCats(s.value)) window.CATS = s.value;
  } catch (_) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  render();
})();
</script>
